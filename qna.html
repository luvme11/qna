<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Me</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4f4f4 0%,#fff 60%);min-height:100vh;display:flex;justify-content:center;padding:70px 0}
button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
a{color:inherit}
main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:64px;width:min(1040px,calc(100vw - 148px))}
.pg-title{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pg-sub{font-size:8px;letter-spacing:.3em;color:#888;margin-top:10px}
.av{width:112px;height:112px;margin-top:30px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1px #ddd,0 8px 20px -8px rgba(0,0,0,.28);background:#e4e4e4;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.nm{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:16px}
.hd{font-size:8px;letter-spacing:.3em;color:#888;margin-top:6px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;height:62px}
.tabs{display:flex;align-items:flex-end}
.tab{position:relative;height:36px;padding:0 18px 3px;font-size:11px;font-weight:700;color:#777;display:flex;align-items:center}
.tab:hover{color:#222}
.tab.on{height:40px;margin-bottom:-1px;background:#fff;color:#111;border-radius:16px 16px 0 0;padding-bottom:6px}
.tab.on::after{content:"";position:absolute;left:50%;bottom:5px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#222}
.tab.on i{position:absolute;bottom:0;width:16px;height:16px}
.tab.on i.l{left:-16px;background:radial-gradient(circle at 0 0,transparent 16px,#fff 16.5px)}
.tab.on i.r{right:-16px;background:radial-gradient(circle at 100% 0,transparent 16px,#fff 16.5px)}
.tab.on:first-child i.l{display:none}
.cnt{margin-bottom:6px;display:flex;align-items:baseline;gap:5px}
.cnt b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cnt small{font-size:9px;font-weight:700;letter-spacing:.15em;color:#777}
.card{display:flex;flex-direction:column;background:#fff;border-radius:24px;overflow:hidden;height:clamp(380px,calc(100vh - 300px),700px);box-shadow:0 26px 40px -20px rgba(0,0,0,.22),0 2px 10px rgba(0,0,0,.04)}
.card.f1{border-top-left-radius:0}
.body{flex:1;min-height:0;overflow-y:auto;padding:22px 26px 26px 24px;scrollbar-width:thin;scrollbar-color:#cfcfcf transparent}
.sh{display:flex;align-items:center;gap:10px}
.sh em{font-style:normal;background:#2a2a2a;color:#fff;font-size:8.5px;font-weight:700;border-radius:10px;height:19px;padding:0 8px;display:grid;place-items:center;white-space:nowrap}
.sh h3{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh i{flex:1;border-top:1px solid #ddd}
.sh span{font-size:8px;font-weight:600;letter-spacing:.3em;color:#777;white-space:nowrap}
.it{margin-bottom:30px}
.ab{margin:14px 0 0 33px;font-size:12px;line-height:1.85;color:#444;white-space:pre-wrap;word-break:break-word}
.ab a{color:#2a2a2a;text-decoration:underline;text-underline-offset:2px;word-break:break-all}.ab a:hover{color:#000;background:#eee}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0 33px;align-items:center}
.tg{font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:10px;border:1px solid #ccc;color:#888}
.tx{margin:14px 0 0 33px;padding:12px 16px;background:#2a2a2a;color:#eee;border-radius:14px;font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.tx a{color:#fff;text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.it .ab,.it .tx,.it .dt{margin-left:0}
.pt{margin-bottom:14px}.pt .sh{cursor:pointer;padding:6px 0}.pt .sh:hover h3{text-decoration:underline;text-underline-offset:3px}
.cv{font-size:10px;color:#999;transition:transform .2s;margin-left:2px}.pt.on .cv{transform:rotate(180deg);color:#222}
.dt{font-size:8px;letter-spacing:.2em;color:#999;margin:8px 0 0 33px}
.empty{font-size:11px;color:#aaa;padding:30px 0;text-align:center}
mark{background:#e6e6e6;color:inherit;border-radius:3px;padding:1px 3px}
.sr{display:flex;align-items:center;gap:10px;padding:10px 24px 14px}
.sr input{flex:1;min-width:0;height:30px;border:1px solid #ddd;border-radius:15px;padding:0 14px;font-size:11px;background:#fafafa;outline:0}
.sr input:focus{border-color:#2a2a2a}
.sr small{font-size:8px;font-weight:700;letter-spacing:.2em;color:#888;white-space:nowrap}
.pgn{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px;margin:22px 0 4px}
.pgn button{min-width:26px;height:26px;padding:0 6px;border-radius:13px;font-size:10px;font-weight:700;color:#777}
.pgn button:hover:not(:disabled){background:#f0f0f0;color:#111}.pgn button.on{background:#2a2a2a;color:#fff}.pgn button:disabled{opacity:.25;cursor:default}
.heart{position:fixed;top:22px;right:38px;font-size:15px;color:#b9b9b9;text-decoration:none}.heart:hover{color:#666}
.pv2{display:inline-block;margin-left:6px;font-size:8.5px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:10px;background:#eee;color:#666;vertical-align:middle}
.intro-img{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:22px 0 0 33px;max-width:480px}
.intro-img.one{grid-template-columns:minmax(0,260px)}
.intro-img a{display:block;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#eee;box-shadow:0 8px 20px -10px rgba(0,0,0,.3)}
.intro-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.intro-img a:hover img{transform:scale(1.04)}
.own{display:flex;justify-content:flex-end;gap:12px;margin:-6px 6px 14px 0;font-size:10px;font-weight:700}
.own button{color:#9aa0a8;padding:2px 0}.own button:hover{color:#111}.own .dl:hover{color:#c0392b}
.ed{margin:-4px 0 20px 42px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ed textarea{display:block;width:100%;min-height:90px;border:1px solid #ddd;border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.6;background:#fafafa;outline:0;resize:vertical}
.ed textarea:focus{border-color:#2a2a2a}
.ed .er{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:10px;color:#777}
.ed .er input[type=file]{font-size:10px;max-width:190px}
.ed .er button{font-size:10px;font-weight:700;color:#777}
.ed .er .sv{background:#2a2a2a;color:#fff;border-radius:14px;height:26px;padding:0 14px}.ed .er .sv:disabled{opacity:.5}
/* 채팅 스타일 */
.body.chat{background:#f5f6f8;padding:22px 22px 26px}
.dv{display:flex;align-items:center;gap:12px;margin:22px 0 18px;font-size:10px;font-weight:600;color:#8a8f98;white-space:nowrap}
.dv:first-child{margin-top:4px}
.dv::before,.dv::after{content:"";flex:1;border-top:1px solid #dcdfe4}
.who{text-align:right;font-size:9px;font-weight:700;letter-spacing:.08em;color:#8a8f98;margin:0 40px 4px 0}
.m{display:flex;align-items:flex-end;gap:6px;margin-bottom:14px}
.m.q{justify-content:flex-end}
.m.a{justify-content:flex-start;gap:8px}
.bub{max-width:min(78%,420px);padding:11px 16px;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.m.q .bub{background:#e6eaf0;color:#2a2a2a;border-radius:20px 20px 6px 20px}
.m.a .bub{background:#fff;color:#2a2a2a;border-radius:20px 20px 20px 6px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.m.a .bub.wait{color:#aaa;font-size:11px}
.bub a{text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.pf{flex:none;width:34px;height:34px;border-radius:50%;background:#d9dce1;overflow:hidden;align-self:flex-start}
.pf img{width:100%;height:100%;object-fit:cover;display:block}
.ar{flex:none;width:22px;height:22px;border-radius:50%;background:#e1e4e9;color:#2fa58a;display:grid;place-items:center}
.ts{flex:none;font-size:9px;color:#9aa0a8;white-space:nowrap}
.m.q .ts,.m.q .ar{order:-1}.m.q .ts{order:-2}
.pgn.top{margin:0 0 18px}
.pi{display:block;max-width:100%;max-height:260px;border-radius:12px;margin:0 0 6px}
.pi.only{margin:0}
.bub a:has(.pi){text-decoration:none}
.cmp{display:none;flex:1;min-width:0;flex-direction:column;gap:6px}
.cr{display:flex;align-items:flex-end;gap:6px;background:#fafafa;border:1px solid #ddd;border-radius:20px;padding:4px 5px}
.cr:focus-within{border-color:#2a2a2a}
.cr textarea{flex:1;min-width:0;border:0;background:none;outline:0;resize:none;font-size:12px;line-height:20px;padding:5px 4px;max-height:96px;font-family:inherit}
.att,.sb{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.att{color:#888;cursor:pointer}.att:hover{color:#111;background:#eee}
.sb{background:#2a2a2a;color:#fff;font-size:13px}.sb:disabled{opacity:.4;cursor:default}
.cpv{display:none;align-items:center;gap:8px;padding-left:4px}.cpv.on{display:flex}
.cpv img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.cpv button{font-size:10px;font-weight:700;color:#888}.cpv button:hover{color:#c0392b}
.cm{font-size:10px;color:#c0392b;padding-left:6px}.cm:empty{display:none}
@media (max-width:1000px){
  body{padding:30px 0}main{grid-template-columns:1fr;gap:26px;width:calc(100vw - 32px)}
  .card{height:auto}.body{overflow:visible}.sh i{display:none}
  .chips,.dt{margin-left:0}
  .intro-img{margin-left:0}
  .ed{margin-left:0}
  .pg-title{font-size:32px}.heart{right:20px}
}
</style>
</head>
<body>
<a class="heart" href="qna-admin.html" aria-label="admin">♡</a>
<main>
  <aside>
    <h1 class="pg-title" id="title"></h1>
    <p class="pg-sub" id="sub"></p>
    <div class="av" id="av"></div>
    <div class="nm" id="nm"></div>
    <div class="hd" id="hd"></div>
  </aside>
  <section>
    <div class="bar"><div class="tabs" id="tabs"></div><div class="cnt"><b id="cur">01</b><small id="tot"></small></div></div>
    <div class="card" id="card"><div class="sr"><input id="q" placeholder="질문·답변 검색"><small id="rc"></small>
      <div class="cmp" id="cmp"><div class="cr"><label class="att" title="이미지 첨부"><input type="file" id="cf" accept="image/*" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></label><textarea id="ci" rows="1" placeholder="질문을 적고 엔터 (줄바꿈은 Shift+엔터)"></textarea><button class="sb" id="cs" aria-label="보내기">↵</button></div><div class="cpv" id="cpv"></div><div class="cm" id="cm"></div></div></div><div class="body" id="body"></div></div>
  </section>
</main>

<script>document.write('<script src="qna-data.js?t='+Date.now()+'"><\/script>')</script>
<script>
const $ = s => document.querySelector(s), pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = s => esc(s).replace(/==(.+?)==/g, '<mark>$1</mark>');
/* 글 안의 http(s) 주소를 눌리는 링크로 바꿈 */
const lk = s => hl(s).replace(/https?:\/\/(?:(?!&quot;|&gt;|&lt;)[^\s<])+/g, m => { const t = m.match(/[.,)\]!?:;]+$/), tail = t ? t[0] : '', u = tail ? m.slice(0, -tail.length) : m; return `<a href="${u}" target="_blank" rel="noopener">${u}</a>${tail}`; });
const D = window.QNA_DATA || {}, ITEMS = D.items || [];
const P = Object.assign({title:'Ask\nMe',sub:'QUESTIONS · ANSWERS',name:'',handle:'',avatar:'',text:'',tags:[]}, D.profile || {});
const TABS = [{k:'intro',label:'소개'},{k:'qna',label:'질문'}];
const SIZE = 15;
/* 소개 탭 이미지: 관리자의 '소개 편집'에서 올린 것 (profile.introImgs) */
const INTRO_IMGS = [].concat(P.introImgs || P.introImg || []).filter(Boolean);
/* 관리자(토큰이 저장된 브라우저)만 비공개 글을 볼 수 있음 */
const OWNER = (() => { try{ const g = JSON.parse(localStorage.getItem('home_gh') || '{}'); return !!(g.owner && g.repo && g.token); }catch(e){ return false; } })();
/* 익명 번호: 올린 순서대로 1, 2, 3… (n이 저장돼 있으면 그 번호) */
const NUM = {}; const renum = () => ITEMS.slice().sort((a,b)=>(a.at||0)-(b.at||0)).forEach((p,i)=>NUM[p.id] = p.n || i+1); renum();
const nameOf = p => p.name || '익명 ' + NUM[p.id];
let T = 0, Q = '', PG = 1, OPEN = null, EDIT = null;
$('#title').innerHTML = P.title.split('\n').map(esc).join('<br>');
$('#sub').textContent = P.sub; $('#nm').textContent = P.name; $('#hd').textContent = P.handle;
if (P.avatar) $('#av').innerHTML = `<img src="${esc(P.avatar)}" alt="">`;
document.title = P.title.replace('\n',' ');
if (P.favicon){ let l = document.querySelector('link[rel~=icon]'); if (!l){ l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); } l.type = 'image/png'; l.href = P.favicon; }
const fmt = t => { const d = new Date(t||0); return isNaN(d)||!t ? '' : d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate()); };

function pager(pg, pages){
  if (pages < 2) return '';
  const s = Math.floor((pg-1)/10)*10 + 1, e = Math.min(pages, s+9), n = [];
  for (let i=s;i<=e;i++) n.push(`<button data-p="${i}" class="${i===pg?'on':''}">${i}</button>`);
  return `<div class="pgn"><button data-p="1" ${pg<2?'disabled':''}>«</button><button data-p="${pg-1}" ${pg<2?'disabled':''}>‹</button>${n.join('')}<button data-p="${pg+1}" ${pg>=pages?'disabled':''}>›</button><button data-p="${pages}" ${pg>=pages?'disabled':''}>»</button></div>`;
}
const tm = t => { const d = new Date(t||0); if (!t || isNaN(d)) return ''; const h = d.getHours(); return (h<12?'오전 ':'오후 ') + (h%12||12) + ':' + pad(d.getMinutes()); };
const DAY = t => { const d = new Date(t||0); return !t || isNaN(d) ? '' : d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'[d.getDay()]+'요일'; };
const ARW = '<span class="ar"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v7a2 2 0 0 0 2 2h7"/><path d="M10 8l3 3-3 3"/></svg></span>';
const PF = '<div class="pf">' + (P.avatar ? `<img src="${esc(P.avatar)}" alt="">` : '') + '</div>';
const pic = (src, text) => src ? `<a href="${esc(src)}" target="_blank" rel="noopener"><img class="pi${text?'':' only'}" src="${esc(src)}" alt="" loading="lazy"></a>` : '';
const ownBar = p => !OWNER ? '' : EDIT === p.id
  ? `<div class="ed" data-id="${esc(p.id)}"><textarea id="ea" placeholder="답변을 적어 주세요  (==글자==는 형광펜)">${esc(p.a)}</textarea><div class="er"><label>이미지 <input type="file" id="eaf" accept="image/*"></label>${p.ai?'<label><input type="checkbox" id="eax"> 현재 이미지 지우기</label>':''}<span style="flex:1"></span><button type="button" data-c>취소</button><button type="button" class="sv" data-sv>저장</button></div></div>`
  : `<div class="own" data-id="${esc(p.id)}"><button data-ans>${(p.a||p.ai)?'답변 수정':'답변 쓰기'}</button><button data-hid>${p.hidden?'공개로 바꾸기':'비공개로 바꾸기'}</button><button class="dl" data-del>삭제</button></div>`;
const row = p => {
  const t = tm(p.at), hasA = p.a || p.ai;
  return `${p.hidden?'<div class="who"><b class="pv2">비공개</b></div>':''}
  <div class="m q"><div class="bub">${pic(p.qi, p.q)}${p.q ? lk(p.q) : ''}</div></div>
  ${ownBar(p)}
  ${hasA && !(OWNER && EDIT === p.id) ? `<div class="m a">${PF}<div class="bub">${pic(p.ai, p.a)}${p.a ? lk(p.a) : ''}</div></div>` : ''}`;
};

function render(){
  $('#tabs').innerHTML = TABS.map((t,i)=>`<button class="tab${i===T?' on':''}" data-t="${i}">${esc(t.label)}${i===T?'<i class="l"></i><i class="r"></i>':''}</button>`).join('');
  $('#cur').textContent = pad(T+1); $('#tot').textContent = '/ ' + pad(TABS.length);
  $('#card').classList.toggle('f1', T===0);
  const intro = TABS[T].k === 'intro';
  $('.sr').style.display = intro ? 'none' : 'flex';
  $('#body').classList.toggle('chat', !intro);
  if (intro){
    $('#body').innerHTML = `<div class="sh"><em>01</em><h3>ABOUT</h3><i></i><span>INTRO</span></div>
      <div class="ab" style="margin-left:33px">${P.text ? lk(P.text) : '소개글을 관리자 페이지에서 적어 주세요.'}</div>
      ${INTRO_IMGS.length ? `<div class="intro-img${INTRO_IMGS.length===1?' one':''}">${INTRO_IMGS.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join('')}</div>` : ''}
      ${(P.tags||[]).length ? `<div class="chips">${P.tags.map(g=>`<span class="tg">${esc(g)}</span>`).join('')}</div>` : ''}`;
    return;
  }
  const q = Q.toLowerCase();
  const all = ITEMS.filter(i => OWNER || !i.hidden).sort((x,y) => (y.at||0) - (x.at||0));
  const list = all.filter(p => !q || [nameOf(p), p.q, p.a].join(' ').toLowerCase().includes(q));
  const cur = list; /* 페이지 나누지 않고 전부 한 번에 (위로 쭉 올려서 보기) */
  $('#rc').textContent = list.length + ' / ' + all.length;
  $('#body').classList.add('chat');
  /* 최신 페이지가 1페이지, 한 페이지 안에서는 오래된 순 → 위에서 아래로 읽는 대화 */
  let last = '', html = '';
  cur.slice().reverse().forEach(p => { const d = DAY(p.at); if (d !== last){ html += `<div class="dv">${d}</div>`; last = d; } html += row(p); });
  $('#body').innerHTML = !list.length ? '<div class="empty">'+(all.length?'검색 결과가 없어요':'아직 올린 게 없어요')+'</div>' : html;
  $('#body').scrollTop = $('#body').scrollHeight;
}
$('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if(!b) return; T = +b.dataset.t; Q = ''; PG = 1; OPEN = null; $('#q').value = ''; render(); };
$('#q').oninput = e => { Q = e.target.value.trim(); PG = 1; render(); };
$('#body').onclick = e => {
  const p = e.target.closest('[data-p]');
  if (p && !p.disabled){ PG = +p.dataset.p; render(); window.scrollTo(0,0); }
};

/* ---------- 질문 쓰기 (관리자 토큰이 있는 브라우저에서만) ---------- */
const GHC = () => { try{ return JSON.parse(localStorage.getItem('home_gh') || '{}'); }catch(e){ return {}; } };
const ghBr = () => GHC().branch || 'main';
const ghH = () => ({Authorization:'Bearer '+GHC().token, Accept:'application/vnd.github+json', 'Content-Type':'application/json'});
const ghU = p => { const g = GHC(); return `https://api.github.com/repos/${g.owner}/${g.repo}/contents/${p}`; };
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fit = (f, max=1280) => new Promise((res, rej) => { const im = new Image(); im.onload = () => {
  const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg', .85)); };
  im.onerror = () => rej(new Error('이미지를 읽을 수 없어요')); im.src = URL.createObjectURL(f); });
async function ghPull(){
  const r = await fetch(ghU('qna-data.js') + `?ref=${ghBr()}&t=${Date.now()}`, {cache:'no-store', headers:ghH()});
  if (r.status === 404) return {d:{profile:{}, items:[]}, sha:''};
  if (!r.ok) throw new Error('불러오기 실패 (' + r.status + ') — 관리자 페이지의 연결 설정을 확인해 주세요');
  const j = await r.json(), d = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))).replace(/^[^{]*/,'').replace(/;\s*$/,''));
  d.items = d.items || []; d.profile = d.profile || {}; return {d, sha:j.sha};
}
async function ghCommit(mut, msg){
  for (let a=0; a<3; a++){
    const {d, sha} = await ghPull(); mut(d); d.updatedAt = Date.now();
    const body = {message:msg, content:b64('window.QNA_DATA = ' + JSON.stringify(d, null, 1) + ';\n'), branch:ghBr()}; if (sha) body.sha = sha;
    const r = await fetch(ghU('qna-data.js'), {method:'PUT', headers:ghH(), body:JSON.stringify(body)});
    if (r.ok) return d;
    if (r.status !== 409 && r.status !== 422) throw new Error('저장 실패 (' + r.status + ')');
    await new Promise(res => setTimeout(res, 700));
  }
  throw new Error('저장 실패 — 다시 시도해 주세요');
}
async function ghImg(path, dataUrl){
  const r = await fetch(ghU(path), {method:'PUT', headers:ghH(), body:JSON.stringify({message:'Upload ' + path, content:dataUrl.split(',')[1], branch:ghBr()})});
  if (!r.ok) throw new Error('이미지 업로드 실패 (' + r.status + ')');
}
if (OWNER){
  $('#q').style.display = 'none'; $('#rc').style.display = 'none'; $('#cmp').style.display = 'flex';
  let FILE = null, BUSY = false;
  const ci = $('#ci'), msg = t => $('#cm').textContent = t || '';
  const grow = () => { ci.style.height = 'auto'; ci.style.height = Math.min(ci.scrollHeight, 96) + 'px'; };
  const pv = () => { const b = $('#cpv'); b.classList.toggle('on', !!FILE); b.innerHTML = FILE ? `<img src="${URL.createObjectURL(FILE)}" alt=""><button type="button" id="cx">✕ 빼기</button>` : ''; };
  ci.oninput = grow;
  $('#cf').onchange = e => { FILE = e.target.files[0] || null; e.target.value = ''; pv(); };
  $('#cpv').onclick = e => { if (e.target.id === 'cx'){ FILE = null; pv(); } };
  async function send(){
    const t = ci.value.trim(); if (BUSY || (!t && !FILE)) return;
    BUSY = true; $('#cs').disabled = true; msg('올리는 중…');
    try{
      const id = uid(); let qi = '';
      if (FILE){ qi = `img/qna/${id}-q-${Date.now().toString(36)}.jpg`; await ghImg(qi, await fit(FILE)); }
      const d = await ghCommit(d => d.items.push({id, at:Date.now(), n:Math.max(0, ...d.items.map(i=>i.n||0), d.items.length) + 1, name:'', q:t, a:'', hidden:false, qi}), 'Add question');
      ITEMS.length = 0; ITEMS.push(...d.items); renum();
      ci.value = ''; grow(); FILE = null; pv(); msg(''); Q = ''; PG = 1; render();
    }catch(e){ msg(e.message || '실패했어요'); }
    BUSY = false; $('#cs').disabled = false;
  }
  $('#cs').onclick = send;
  ci.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } };

  /* ---- 메인 화면에서 바로 답변 쓰기 / 비공개 / 삭제 ---- */
  async function ghDel(path){
    const r = await fetch(ghU(path) + `?ref=${ghBr()}&t=${Date.now()}`, {cache:'no-store', headers:ghH()}); if (!r.ok) return;
    await fetch(ghU(path), {method:'DELETE', headers:ghH(), body:JSON.stringify({message:'Delete ' + path, sha:(await r.json()).sha, branch:ghBr()})});
  }
  const sync = d => { ITEMS.length = 0; ITEMS.push(...d.items); renum(); };
  const redraw = () => { const st = $('#body').scrollTop; render(); $('#body').scrollTop = st; };
  $('#body').addEventListener('click', async e => {
    const w = e.target.closest('[data-id]'); if (!w) return;
    const id = w.dataset.id, it = ITEMS.find(x => x.id === id); if (!it) return;
    if (e.target.closest('[data-ans]')){ EDIT = id; redraw(); const t = $('#ea'); if (t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } return; }
    if (e.target.closest('[data-c]')){ EDIT = null; msg(''); redraw(); return; }
    if (BUSY) return;
    if (e.target.closest('[data-hid]')){
      BUSY = true; msg('바꾸는 중…');
      try{ sync(await ghCommit(d => { const x = d.items.find(i => i.id === id); if (x) x.hidden = !x.hidden; }, 'Toggle hidden')); msg(''); redraw(); }catch(err){ msg(err.message || '실패했어요'); }
      BUSY = false; return;
    }
    if (e.target.closest('[data-del]')){
      if (!confirm('정말 삭제할까요?')) return;
      BUSY = true; msg('삭제 중…');
      try{ sync(await ghCommit(d => { d.items = d.items.filter(x => x.id !== id); }, 'Delete')); [it.qi, it.ai].filter(Boolean).forEach(p => ghDel(p).catch(()=>{})); msg(''); redraw(); }catch(err){ msg(err.message || '실패했어요'); }
      BUSY = false; return;
    }
    if (e.target.closest('[data-sv]')){
      const btn = e.target.closest('[data-sv]'), f = $('#eaf').files[0], del = $('#eax') && $('#eax').checked, a = $('#ea').value.trim();
      BUSY = true; btn.disabled = true; msg('저장 중…');
      try{
        let ai = it.ai || '', old = '';
        if (f || del){ old = ai; ai = ''; }
        if (f){ ai = `img/qna/${id}-a-${Date.now().toString(36)}.jpg`; await ghImg(ai, await fit(f)); }
        const v = {a, ai}; if (a !== (it.a || '') || ai !== (it.ai || '')) v.aAt = (a || ai) ? Date.now() : 0;
        sync(await ghCommit(d => { const x = d.items.find(i => i.id === id); if (x) Object.assign(x, v); }, 'Answer'));
        if (old) ghDel(old).catch(()=>{});
        EDIT = null; msg(''); redraw();
      }catch(err){ msg(err.message || '실패했어요'); btn.disabled = false; }
      BUSY = false;
    }
  });
}
render();
</script>
