<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Me</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4f4f4 0%,#fff 60%);min-height:100vh;display:flex;justify-content:center;padding:70px 0}
button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
a{color:inherit}
main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:64px;width:min(1040px,calc(100vw - 148px))}
.pg-title{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pg-sub{font-size:8px;letter-spacing:.3em;color:#888;margin-top:10px}
.av{width:112px;height:112px;margin-top:30px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1px #ddd,0 8px 20px -8px rgba(0,0,0,.28);background:#e4e4e4;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.nm{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:16px}
.hd{font-size:8px;letter-spacing:.3em;color:#888;margin-top:6px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;height:62px}
.tabs{display:flex;align-items:flex-end}
.tab{position:relative;height:36px;padding:0 18px 3px;font-size:11px;font-weight:700;color:#777;display:flex;align-items:center}
.tab:hover{color:#222}
.tab.on{height:40px;margin-bottom:-1px;background:#fff;color:#111;border-radius:16px 16px 0 0;padding-bottom:6px}
.tab.on::after{content:"";position:absolute;left:50%;bottom:5px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#222}
.tab.on i{position:absolute;bottom:0;width:16px;height:16px}
.tab.on i.l{left:-16px;background:radial-gradient(circle at 0 0,transparent 16px,#fff 16.5px)}
.tab.on i.r{right:-16px;background:radial-gradient(circle at 100% 0,transparent 16px,#fff 16.5px)}
.tab.on:first-child i.l{display:none}
.cnt{margin-bottom:6px;display:flex;align-items:baseline;gap:5px}
.cnt b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cnt small{font-size:9px;font-weight:700;letter-spacing:.15em;color:#777}
.card{display:flex;flex-direction:column;background:#fff;border-radius:24px;overflow:hidden;height:clamp(380px,calc(100vh - 300px),700px);box-shadow:0 26px 40px -20px rgba(0,0,0,.22),0 2px 10px rgba(0,0,0,.04)}
.card.f1{border-top-left-radius:0}
.body{flex:1;min-height:0;overflow-y:auto;padding:22px 26px 26px 24px;scrollbar-width:thin;scrollbar-color:#cfcfcf transparent}
.sh{display:flex;align-items:center;gap:10px}
.sh em{font-style:normal;background:#2a2a2a;color:#fff;font-size:8.5px;font-weight:700;border-radius:10px;height:19px;padding:0 8px;display:grid;place-items:center;white-space:nowrap}
.sh h3{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh i{flex:1;border-top:1px solid #ddd}
.sh span{font-size:8px;font-weight:600;letter-spacing:.3em;color:#777;white-space:nowrap}
.it{margin-bottom:30px}
.ab{margin:14px 0 0 33px;font-size:12px;line-height:1.85;color:#444;white-space:pre-wrap;word-break:break-word}
.ab a{color:#2a2a2a;text-decoration:underline;text-underline-offset:2px;word-break:break-all}.ab a:hover{color:#000;background:#eee}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0 33px;align-items:center}
.tg{font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:10px;border:1px solid #ccc;color:#888}
.tx{margin:14px 0 0 33px;padding:12px 16px;background:#2a2a2a;color:#eee;border-radius:14px;font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.tx a{color:#fff;text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.it .ab,.it .tx,.it .dt{margin-left:0}
.pt{margin-bottom:14px}.pt .sh{cursor:pointer;padding:6px 0}.pt .sh:hover h3{text-decoration:underline;text-underline-offset:3px}
.cv{font-size:10px;color:#999;transition:transform .2s;margin-left:2px}.pt.on .cv{transform:rotate(180deg);color:#222}
.dt{font-size:8px;letter-spacing:.2em;color:#999;margin:8px 0 0 33px}
.empty{font-size:11px;color:#aaa;padding:30px 0;text-align:center}
mark{background:#e6e6e6;color:inherit;border-radius:3px;padding:1px 3px}
.sr{display:flex;align-items:center;gap:10px;padding:16px 24px 0}
.sr input{flex:1;min-width:0;height:30px;border:1px solid #ddd;border-radius:15px;padding:0 14px;font-size:11px;background:#fafafa;outline:0}
.sr input:focus{border-color:#2a2a2a}
.sr small{font-size:8px;font-weight:700;letter-spacing:.2em;color:#888;white-space:nowrap}
.pgn{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px;margin:22px 0 4px}
.pgn button{min-width:26px;height:26px;padding:0 6px;border-radius:13px;font-size:10px;font-weight:700;color:#777}
.pgn button:hover:not(:disabled){background:#f0f0f0;color:#111}.pgn button.on{background:#2a2a2a;color:#fff}.pgn button:disabled{opacity:.25;cursor:default}
.heart{position:fixed;top:22px;right:38px;font-size:15px;color:#b9b9b9;text-decoration:none}.heart:hover{color:#666}
.pv2{display:inline-block;margin-left:6px;font-size:8.5px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:10px;background:#eee;color:#666;vertical-align:middle}
@media (max-width:1000px){
  body{padding:30px 0}main{grid-template-columns:1fr;gap:26px;width:calc(100vw - 32px)}
  .card{height:auto}.body{overflow:visible}.sh i{display:none}
  .chips,.dt{margin-left:0}
  .pg-title{font-size:32px}.heart{right:20px}
}
</style>
</head>
<body>
<a class="heart" href="qna-admin.html" aria-label="admin">♡</a>
<main>
  <aside>
    <h1 class="pg-title" id="title"></h1>
    <p class="pg-sub" id="sub"></p>
    <div class="av" id="av"></div>
    <div class="nm" id="nm"></div>
    <div class="hd" id="hd"></div>
  </aside>
  <section>
    <div class="bar"><div class="tabs" id="tabs"></div><div class="cnt"><b id="cur">01</b><small id="tot"></small></div></div>
    <div class="card" id="card"><div class="sr"><input id="q" placeholder="질문·답변 검색"><small id="rc"></small></div><div class="body" id="body"></div></div>
  </section>
</main>

<script>document.write('<script src="qna-data.js?t='+Date.now()+'"><\/script>')</script>
<script>
const $ = s => document.querySelector(s), pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = s => esc(s).replace(/==(.+?)==/g, '<mark>$1</mark>');
/* 글 안의 http(s) 주소를 눌리는 링크로 바꿈 */
const lk = s => hl(s).replace(/https?:\/\/(?:(?!&quot;|&gt;|&lt;)[^\s<])+/g, m => { const t = m.match(/[.,)\]!?:;]+$/), tail = t ? t[0] : '', u = tail ? m.slice(0, -tail.length) : m; return `<a href="${u}" target="_blank" rel="noopener">${u}</a>${tail}`; });
const D = window.QNA_DATA || {}, ITEMS = D.items || [];
const P = Object.assign({title:'Ask\nMe',sub:'QUESTIONS · ANSWERS',name:'',handle:'',avatar:'',text:'',tags:[]}, D.profile || {});
const TABS = [{k:'intro',label:'소개'},{k:'qna',label:'질문'}];
const SIZE = 15;
/* 관리자(토큰이 저장된 브라우저)만 비공개 글을 볼 수 있음 */
const OWNER = (() => { try{ const g = JSON.parse(localStorage.getItem('home_gh') || '{}'); return !!(g.owner && g.repo && g.token); }catch(e){ return false; } })();
/* 익명 번호: 올린 순서대로 1, 2, 3… (n이 저장돼 있으면 그 번호) */
const NUM = {}; ITEMS.slice().sort((a,b)=>(a.at||0)-(b.at||0)).forEach((p,i)=>NUM[p.id] = p.n || i+1);
const nameOf = p => p.name || '익명 ' + NUM[p.id];
let T = 0, Q = '', PG = 1, OPEN = null;
$('#title').innerHTML = P.title.split('\n').map(esc).join('<br>');
$('#sub').textContent = P.sub; $('#nm').textContent = P.name; $('#hd').textContent = P.handle;
if (P.avatar) $('#av').innerHTML = `<img src="${esc(P.avatar)}" alt="">`;
document.title = P.title.replace('\n',' ');
if (P.favicon){ let l = document.querySelector('link[rel~=icon]'); if (!l){ l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); } l.type = 'image/png'; l.href = P.favicon; }
const fmt = t => { const d = new Date(t||0); return isNaN(d)||!t ? '' : d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate()); };

function pager(pg, pages){
  if (pages < 2) return '';
  const s = Math.floor((pg-1)/10)*10 + 1, e = Math.min(pages, s+9), n = [];
  for (let i=s;i<=e;i++) n.push(`<button data-p="${i}" class="${i===pg?'on':''}">${i}</button>`);
  return `<div class="pgn"><button data-p="1" ${pg<2?'disabled':''}>«</button><button data-p="${pg-1}" ${pg<2?'disabled':''}>‹</button>${n.join('')}<button data-p="${pg+1}" ${pg>=pages?'disabled':''}>›</button><button data-p="${pages}" ${pg>=pages?'disabled':''}>»</button></div>`;
}
const row = p => {
  const on = OPEN === p.id, first = String(p.q||'').split('\n')[0];
  return `<div class="it pt${on?' on':''}"><div class="sh" data-o="${esc(p.id)}"><em>${esc(nameOf(p))}</em><h3>${hl(first||'(내용 없음)')}${p.hidden?'<b class="pv2">비공개</b>':''}</h3><i></i><span>${fmt(p.at)}</span><span class="cv">▾</span></div>
  ${on ? `<div class="ab">${lk(p.q||'')}</div>${p.a ? `<div class="tx">${lk(p.a)}</div>` : '<div class="dt">ANSWER · 아직 답변 전이에요</div>'}` : ''}</div>`;
};

function render(){
  $('#tabs').innerHTML = TABS.map((t,i)=>`<button class="tab${i===T?' on':''}" data-t="${i}">${esc(t.label)}${i===T?'<i class="l"></i><i class="r"></i>':''}</button>`).join('');
  $('#cur').textContent = pad(T+1); $('#tot').textContent = '/ ' + pad(TABS.length);
  $('#card').classList.toggle('f1', T===0);
  const intro = TABS[T].k === 'intro';
  $('.sr').style.display = intro ? 'none' : 'flex';
  if (intro){
    $('#body').innerHTML = `<div class="sh"><em>01</em><h3>ABOUT</h3><i></i><span>INTRO</span></div>
      <div class="ab" style="margin-left:33px">${P.text ? lk(P.text) : '소개글을 관리자 페이지에서 적어 주세요.'}</div>
      ${(P.tags||[]).length ? `<div class="chips">${P.tags.map(g=>`<span class="tg">${esc(g)}</span>`).join('')}</div>` : ''}`;
    return;
  }
  const q = Q.toLowerCase();
  const all = ITEMS.filter(i => OWNER || !i.hidden).sort((x,y) => (y.at||0) - (x.at||0));
  const list = all.filter(p => !q || [nameOf(p), p.q, p.a].join(' ').toLowerCase().includes(q));
  const pages = Math.max(1, Math.ceil(list.length/SIZE));
  PG = Math.min(PG, pages);
  const cur = list.slice((PG-1)*SIZE, PG*SIZE);
  $('#rc').textContent = list.length + ' / ' + all.length;
  $('#body').innerHTML = !list.length ? '<div class="empty">'+(all.length?'검색 결과가 없어요':'아직 올린 게 없어요')+'</div>' : cur.map(row).join('') + pager(PG, pages);
}
$('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if(!b) return; T = +b.dataset.t; Q = ''; PG = 1; OPEN = null; $('#q').value = ''; render(); $('#body').scrollTop = 0; };
$('#q').oninput = e => { Q = e.target.value.trim(); PG = 1; render(); };
$('#body').onclick = e => {
  const p = e.target.closest('[data-p]');
  if (p && !p.disabled){ PG = +p.dataset.p; render(); $('#body').scrollTop = 0; window.scrollTo(0,0); return; }
  const ob = e.target.closest('[data-o]');
  if (ob){ const id = ob.dataset.o; OPEN = OPEN === id ? null : id; render(); const h = document.querySelector('[data-o="' + id + '"]'); if (h) h.scrollIntoView({block:'nearest'}); }
};
render();
</script>
</body>
</html>
